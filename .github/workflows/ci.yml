name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      # The privacy scan's private values and rules. A CI build scans strictly, so it fails without them.
      PRIVACY_SCAN_PRIVATE: ${{ secrets.PRIVACY_SCAN_PRIVATE }}
      PRIVACY_SCAN_RULES: ${{ secrets.PRIVACY_SCAN_RULES }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Install ffprobe for the privacy scan of video metadata
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # CI is set, so the tests tagged @local are skipped
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
