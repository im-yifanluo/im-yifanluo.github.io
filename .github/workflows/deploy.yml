name: Deploy

# Publishes the site to GitHub Pages on every push to main, or when started by hand.
# Settings → Pages → Source must be "GitHub Actions" (custom domain: yifanluo.dev).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # withastro/action is a composite action, so the build reads these from the job's environment
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      PRIVACY_STRICT: 1
      PRIVACY_SCAN_PRIVATE: ${{ secrets.PRIVACY_SCAN_PRIVATE }}
      PRIVACY_SCAN_RULES: ${{ secrets.PRIVACY_SCAN_RULES }}
      SITE_URL: ${{ vars.SITE_URL }}
      # Cloudflare Web Analytics for yifanluo.dev. Not a secret: the token ships in every page.
      CF_BEACON_TOKEN: c690f58f34234fc5a3d61ecda57976b3
    steps:
      - uses: actions/checkout@v7
      - name: Install ffprobe for the privacy scan of video metadata
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install, build and upload the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
