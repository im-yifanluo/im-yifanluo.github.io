order: 5
title: "PhotoGleam: Gemini picks the edits for each photo"
short: PhotoGleam
role: Sole developer
start: 2024-04
end: 2024-08
roleLine: Sole developer
award: First Place, Mobile and Web · IgniteCS Programming Expo
outcome: "A photo app on both app stores: Gemini writes a set of named filters for each photo, and my server applies them."
