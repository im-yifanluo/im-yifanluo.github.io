    alt: "Reliability diagram: my first bot’s live forecasts follow the diagonal; the crowd’s average forecast on the same markets sits below it, over-pricing events. Right: the club backtest’s 782,157 forecasts lie on the diagonal."
    width: wide
    caption: Forecast against outcome. Live, my forecasts averaged 42.2% where 42.2% happened; the crowd averaged 47.1%. The club backtest held within 2 points of the diagonal.
