hero:
  media: world-cup-forecasting-hero
  part: hero
  alt: "Two lines climb from zero across 103 matches, slowly in the group stage and steeply in the knockouts and the final: my first bot ends at +4,732 points, #17 of 4,013 overall; my second at +4,451."
  caption: "Match by match: knockout forecasts counted double and the final triple; the final alone moved my first bot from 31st to 17th."
lead:
  - "The Jump Trading Probability Cup asked for a probability on about ten yes/no questions in each of the 104 World Cup matches, scored against the field. My first bot finished #17 of 4,013; my second finished #5 in the knockout stage."
  - "The engine never rates teams itself: it anchors every answer on the betting market's odds and models only what the market does not price. A Claude Code agent ran it in production for 38 days, under rules I set: every number came from the pipeline, and every submission was checked."
did:
  - "Built the pricing engine: one Dixon–Coles scoreline grid, fitted to de-margined bookmaker and Polymarket odds, answers every goal question consistently."
  - Fitted negative-binomial models for corners, cards, shots and fouls on odds-implied scoring rates from ~41k club matches; player props follow the confirmed lineup.
  - Mapped every question to one of 65 families, building and testing 19 new ones during the knockouts, each on the day it appeared.
  - "Designed the agent operations: a Claude Code agent ran it for 38 days, scheduling passes before each kickoff, researching lineups and verifying every submission."
  - "Ran my second bot as a live A/B bench: a change reached my main bot only after winning its own settled markets."
