lead:
  - Framelight is a camera app that reads the live preview on the phone and tells you where to point, how far to zoom and when to shoot. It is live on the App Store and Google Play.
  - "I'm its technical lead: I designed the guidance loop, trained and deployed its composition model, set the app's architecture and led the 15-person team that built and shipped it."
did:
  - "Designed the real-time guidance loop: it finds the subject on-device, scores 7–8 framings anchored on it and turns the best into one steady prompt."
  - Trained and deployed the on-device composition model (MobileNetV2, TFLite, int8 weights); on CADB it picks the better of two photos 76.8% of the time.
  - "Set the app's architecture and led everything we built: camera-thread subject tracking, auto-zoom, selfie mode, a level guide and zoom dial, and framelight.ai."
  - "Designed and built the film-look pipeline: ~296 source LUTs curated to 60 looks, ranked per photo and graded by one GPU shader."
  - "Shipped the app to both stores: a native Kotlin module for scoped-storage saving, Android 15's 16 KB page-size compliance and App Review."
