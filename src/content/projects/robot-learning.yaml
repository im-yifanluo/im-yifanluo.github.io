lead:
  - I built a real-world imitation-learning pipeline on the UMI stack, on my own rig and data, and trained diffusion policies for a UR5e arm; the work won the URSA Best Research Poster Award (2026).
  - On the real arm I traced three failures from the logs and fixed them; after the fixes, policies I trained on the lab's teleop datasets grasped an Allen key and turned a knob.
didGroups:
  - id: data
    label: From handheld clips to trained policies
    did:
      - Collected 500+ demonstrations, handheld and in simulation, and built the data path that turns my GoPro clips into metric 3D trajectories and training episodes.
      - "Tracked my recordings with ORB-SLAM3 + IMU and built a SLAM QA tool to check them: all 197 cylinder grasps tracked start to finish."
      - Trained diffusion policies for ≈180 GPU-hours on one RTX 5080, after porting the stack to Blackwell, and wrote an HDF5 → zarr converter with validation for the lab's datasets.
      - Pretrained a visuo-tactile CLIP encoder (FreeTacMan method), fixed its scheduler and normalization bugs, and integrated it into the lab's Diffusion Policy fork.
  - id: on-the-robot
    label: From logs to working rollouts
    did:
      - Wrote the ROS 2 node that runs the policies on the UR5e, smoothing 10 Hz plans into 60 Hz commands, and a step-mode harness that logs every input and predicted plan.
      - Fixed the gripper snapping shut (it opens wider than UMI's convention) and the robot's speed (actions were 0.3 s apart, not 0.1 s).
      - Measured the arm's lag at 0.13–0.15 s, found a backward jerk at every plan hand-off and made each new plan start further ahead.
